# Builds the ProEd and ProEd Admin APKs on GitHub (no Android Studio needed) and publishes them
# to the "apk-latest" release, with fixed download links:
#   https://github.com/<owner>/<repo>/releases/download/apk-latest/ProEd.apk
#   https://github.com/<owner>/<repo>/releases/download/apk-latest/ProEd-Admin.apk
# Run it from the "Actions" tab ("Run workflow").
# Optional settings (repository Settings > Secrets and variables > Actions):
#   Variable  PROED_SERVER_URL          a ProEd server (or the first line of a SERVER_URL file).
#             Without a server, the APKs run in serverless mode: access rules live in
#             proed-config.json in this repository, managed by ProEd Admin with a GitHub token.
#   Variable  PROED_ACCESS_PUBLIC_KEY   access public key printed by the setup script (optional)
#   Secrets   PROED_KEYSTORE_BASE64, PROED_KEYSTORE_PASSWORD, PROED_KEY_ALIAS, PROED_KEY_PASSWORD
#             (student app release signing), and the same with PROED_ADMIN_ prefix for the admin app.
name: Android APKs

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: proed-app
            name: ProEd
            secret_prefix: PROED
          - app: proed-admin
            name: ProEd-Admin
            secret_prefix: PROED_ADMIN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Write .env.android
        run: |
          URL="${{ vars.PROED_SERVER_URL }}"
          if [ -z "$URL" ] && [ -f SERVER_URL ]; then URL="$(head -n 1 SERVER_URL | tr -d '[:space:]')"; fi
          ENV=${{ matrix.app }}/.env.android
          if [ -n "$URL" ]; then
            echo "Server mode: $URL"
            echo "VITE_SERVER_URL=$URL" > $ENV
          else
            echo "Serverless mode: access rules from proed-config.json"
            echo "VITE_CONFIG_URL=https://raw.githubusercontent.com/${{ github.repository }}/HEAD/proed-config.json" > $ENV
          fi
          echo "VITE_GITHUB_REPO=${{ github.repository }}" >> $ENV
          echo "VITE_ACCESS_PUBLIC_KEY=${{ vars.PROED_ACCESS_PUBLIC_KEY }}" >> ${{ matrix.app }}/.env.android
      # Same signing key on every build, so a new APK installs over the previous one.
      # Without your own keystore secrets, a key is created on the first build and kept in the
      # Actions cache (it expires after 7 days without any build). Your secrets always win.
      - name: Reuse the CI signing key
        uses: actions/cache@v4
        with:
          path: ~/proed-signing/${{ matrix.app }}.jks
          key: proed-signing-${{ matrix.app }}-v1
      - name: Create the CI signing key on the first build
        run: |
          mkdir -p ~/proed-signing
          F=~/proed-signing/${{ matrix.app }}.jks
          if [ ! -f "$F" ]; then
            keytool -genkeypair -noprompt -keystore "$F" -alias proed -storepass proed-ci-key -keypass proed-ci-key \
              -dname "CN=ProEd" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Build web app and sync Android project
        run: npm run android:sync -w ${{ matrix.app }}
      - name: Release APK
        working-directory: ${{ matrix.app }}/android
        env:
          KEYSTORE_BASE64: ${{ secrets[format('{0}_KEYSTORE_BASE64', matrix.secret_prefix)] }}
          PROED_KEYSTORE_PASSWORD: ${{ secrets[format('{0}_KEYSTORE_PASSWORD', matrix.secret_prefix)] }}
          PROED_KEY_ALIAS: ${{ secrets[format('{0}_KEY_ALIAS', matrix.secret_prefix)] }}
          PROED_KEY_PASSWORD: ${{ secrets[format('{0}_KEY_PASSWORD', matrix.secret_prefix)] }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with your keystore secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            PROED_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease --no-daemon
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "Signing with the CI key."
            PROED_KEYSTORE_FILE=~/proed-signing/${{ matrix.app }}.jks PROED_KEYSTORE_PASSWORD=proed-ci-key \
              PROED_KEY_ALIAS=proed PROED_KEY_PASSWORD=proed-ci-key ./gradlew assembleRelease --no-daemon
          fi
      - name: Collect APK
        run: |
          mkdir -p out
          cp ${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk out/${{ matrix.name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-apk
          path: out/*.apk
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish to the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          BASE="https://github.com/${{ github.repository }}/releases/download/apk-latest"
          NOTES="Latest ProEd APKs (built from ${GITHUB_SHA::7}).

          - ProEd (students): $BASE/ProEd.apk
          - ProEd Admin: $BASE/ProEd-Admin.apk"
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --notes "$NOTES"
          else
            gh release create apk-latest --target "$GITHUB_SHA" --title "ProEd APKs" --notes "$NOTES"
          fi
          gh release upload apk-latest out/*.apk --clobber
